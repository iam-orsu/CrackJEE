name: jeeneet
# Shared log rotation for every service: caps each container's JSON log at 50 MB (5 × 10 MB)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jeedb
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # max_connections covers the backend pool (DB_CONNECTION_LIMIT per process) plus the migrate job.
    # shared_buffers ≈ 25% of mem_limit. log_min_duration_statement logs slow queries (>500 ms) for monitoring.
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c log_min_duration_statement=500
    mem_limit: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeeuser} -d ${POSTGRES_DB:-jeedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # maxmemory is 512 MB; mem_limit leaves headroom for Redis's own overhead and the AOF rewrite.
    # noeviction: Redis never silently drops served lists, locks or rate counters. When it is full, writes fail
    # and the app degrades (fail-open limits, cache misses) instead of losing state that correctness depends on.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    mem_limit: 640m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # One-shot: applies migrations and seeds the question banks, then exits.
  # The backend waits for it to complete successfully, so backend replicas never run migrations.
  migrate:
    build:
      context: .                         # project root so COPY data/ works
      dockerfile: backend/Dockerfile
    command: ["sh", "/app/migrate.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/jeedb?connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=20
    volumes:
      - ./data:/app/data:ro
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: .                         # project root so COPY data/ works
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/jeedb?connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3001
      FRONTEND_URL: https://${VPS_IP:?VPS_IP must be set in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      DEEPSEEK_CONCURRENCY: ${DEEPSEEK_CONCURRENCY:-6}
      DB_FANOUT_CONCURRENCY: ${DB_FANOUT_CONCURRENCY:-5}
      # Thread pool for native bcrypt (password hashing). Node's default of 4 would serialise login bursts.
      UV_THREADPOOL_SIZE: 16
    volumes:
      # Read-only: the running server never writes the question banks (mock questions live in the database)
      - ./data:/app/data:ro
    # Two instances share the load. Rate limits, locks and caches live in Redis, so they hold across instances.
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    mem_limit: 1g
    # Lets in-flight requests and background mock generations finish on deploy (server.close + SIGTERM handler)
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    mem_limit: 128m
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging

  # ── Monitoring stack (opt-in via COMPOSE_PROFILES=monitoring) ────────────────
  # Access Grafana by SSH-tunnelling to the VPS: ssh -L 3200:localhost:3200 user@vps
  # then open http://localhost:3200 (default login: admin / admin — change on first login)
  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 256m
    profiles: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      # Read Docker container logs directly from the host filesystem (read-only)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    mem_limit: 128m
    profiles: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.2
    # Bind only to localhost — access via SSH tunnel, never exposed publicly
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on: [loki]
    mem_limit: 256m
    profiles: [monitoring]
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
